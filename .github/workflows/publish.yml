name: publish

on:
  push:
    branches: [main]
  # So a failed publish can be retried without an empty commit.
  workflow_dispatch:

# A newer commit on main should win the race for `latest` rather than queue behind an
# older one that would overwrite it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Publishing `latest` unconditionally means a broken commit becomes the image everyone
  # pulls. The tests take seconds; the gate is worth it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      - run: go test ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with the built-in token.
      packages: write

    outputs:
      version: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v7

      # Only needed for the final alpine stage's apk step, which is the one thing that
      # runs on the target architecture. The Go builds cross-compile natively.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No secret to configure: the automatic token can write packages for this repo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ steps.sha.outputs.short }}
          platforms: linux/amd64,linux/arm64
          # The sing-box stage clones and compiles sing-box from source, which is the
          # expensive part. Cached, an unchanged SINGBOX_VERSION is a layer hit.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keeps the package listing to one real platform instead of adding an
          # "unknown/unknown" attestation entry beside it.
          provenance: false

      # The Dockerfile already fails the build if sing-box lacks with_v2ray_api, so this
      # is not that check — it records the tags in the run log, where they are visible
      # without pulling the image.
      - name: Report the published build
        run: |
          docker run --rm --entrypoint sing-box \
            ghcr.io/${{ github.repository }}:latest version
          docker run --rm ghcr.io/${{ github.repository }}:latest version

  # A job of its own rather than steps on `publish`, because a failing `test` *skips*
  # `publish` rather than failing it, and a step in a job that never starts cannot report
  # that it never started. This one runs either way and reads the results off `needs`.
  notify:
    needs: [test, publish]
    # Not always(): cancel-in-progress means a newer push kills the run in flight, and
    # being told that a commit you just superseded was cancelled is noise.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}

    # The secrets context is not available to `if`, so the presence check goes through
    # env. Without this, a repo that has not set the secrets yet gets a red run on every
    # push — a broken notifier should not look like a broken build.
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

    steps:
      - name: Notify Telegram on success
        if: ${{ env.TELEGRAM_TOKEN != '' && env.TELEGRAM_TO != '' && needs.publish.result == 'success' }}
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ env.TELEGRAM_TO }}
          token: ${{ env.TELEGRAM_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            📦 *${{ github.repository }}* published `ghcr.io/${{ github.repository }}:latest`

            version `${{ needs.publish.outputs.version }}` — [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) by ${{ github.actor }}

      - name: Notify Telegram on failure
        if: ${{ env.TELEGRAM_TOKEN != '' && env.TELEGRAM_TO != '' && needs.publish.result != 'success' }}
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ env.TELEGRAM_TO }}
          token: ${{ env.TELEGRAM_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          # Which half broke is the first thing worth knowing: a failing test means the
          # commit is bad, a failing publish means the commit is fine and the build is not.
          message: |
            ❌ *${{ github.repository }}* ${{ needs.test.result != 'success' && 'tests failed' || 'publish failed' }}

            [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) by ${{ github.actor }}
            [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
